version: "2"

linters:
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
    gosec:
      excludes:
        - G115 # integer overflow conversion; sizes are user-provided configuration
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - revive
      - path: examples/
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
